<head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Special+Elite&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

    * { box-sizing: border-box; }

    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin: 0;
        min-height: 100vh;
        padding: 40px 16px;
        background:
            radial-gradient(ellipse at top, #d9cba8 0%, #b9a578 100%);
        font-family: 'EB Garamond', Georgia, serif;
    }

    h1 {
        font-family: 'Caveat', cursive;
        font-size: 3.2rem;
        color: #4a3b28;
        margin: 0 0 20px 0;
        transform: rotate(-2deg);
        text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
    }

    /* Paper card wrapping the whole app */
    input#taskinput {
        font-family: 'EB Garamond', Georgia, serif;
        font-size: 1.1rem;
        padding: 10px 14px;
        width: 280px;
        max-width: 70vw;
        border: none;
        border-bottom: 2px dashed #8a7a5c;
        background: repeating-linear-gradient(
            #fdf6e3 0px, #fdf6e3 27px, #d8cca0 28px
        );
        box-shadow: inset 0 -1px 0 rgba(0,0,0,0.05);
        outline: none;
        color: #3a2f1e;
    }

    input#taskinput:focus {
        border-bottom-color: #b5482f;
    }

    button {
        font-family: 'Special Elite', 'Courier New', monospace;
        font-size: 0.85rem;
        letter-spacing: 0.5px;
        padding: 9px 16px;
        margin: 4px;
        border: 1px solid #6b5a3e;
        border-radius: 2px;
        background: #f4ecd8;
        color: #4a3b28;
        cursor: pointer;
        box-shadow: 2px 2px 0 rgba(74, 59, 40, 0.35);
        transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    button:hover {
        transform: translate(-1px, -1px);
        box-shadow: 3px 3px 0 rgba(74, 59, 40, 0.4);
    }

    button:active {
        transform: translate(1px, 1px);
        box-shadow: 1px 1px 0 rgba(74, 59, 40, 0.4);
    }

    #addbutton {
        background: #b5482f;
        color: #fdf6e3;
        border-color: #7d3220;
    }

    /* The filter tabs row */
    body > div:first-of-type {
        display: flex;
        gap: 6px;
        margin: 14px 0 22px 0;
    }

    /* The "paper sheet" holding the task list */
    #container {
        width: 420px;
        max-width: 85vw;
        min-height: 120px;
        padding: 24px 22px;
        background:
            repeating-linear-gradient(
                #fdf6e3 0px, #fdf6e3 31px, #e3d6ac 32px
            );
        background-color: #fdf6e3;
        border-left: 3px solid #b5482f;
        box-shadow:
            0 1px 0 rgba(0,0,0,0.03),
            0 8px 20px rgba(74, 59, 40, 0.35),
            0 1px 4px rgba(74, 59, 40, 0.2);
        border-radius: 1px;
        position: relative;
    }

    #container::before {
        content: "";
        position: absolute;
        top: -10px;
        right: 24px;
        width: 60px;
        height: 22px;
        background: rgba(240, 217, 160, 0.55);
        border: 1px solid rgba(180, 150, 90, 0.4);
        transform: rotate(3deg);
    }

    #tasksitem {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 6px 0;
        border-bottom: 1px dotted #b9a578;
    }

    #tasksitem p {
        flex: 1;
        margin: 0;
        font-size: 1.15rem;
        color: #3a2f1e;
    }

    #tasksitem input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #b5482f;
        cursor: pointer;
    }

    #tasksitem button {
        font-size: 0.7rem;
        padding: 5px 10px;
        background: #e3d6ac;
        color: #6b5a3e;
        box-shadow: 1px 1px 0 rgba(74, 59, 40, 0.3);
    }
</style>
</head>

<body>
    <h1>MY DIARY APP</h1>
    <input id="taskinput" />
    <button id="addbutton">ADD</button>
    <br>
    <div>
    <button style="background-color: white;" id="completebtn">COMPLETED TASKS</button>
    <button style="background-color: white;" id="incompletebtn">INCOMPLETE TASKS</button>
    <button style="background-color: white;" id="alltasks">ALL TASKS</button>
        </div>
    <div id="container"></div>

    <script>
        //grab the items
        let addbtn = document.getElementById("addbutton")
        let taskinput = document.getElementById("taskinput")
        let container = document.getElementById("container")
        let alltaskbtn = document.getElementById("alltasks")
        let incomplete = document.getElementById("incompletebtn")
        let complete = document.getElementById("completebtn")

        let alltasks = [] // we use this list to store
        if (localStorage.getItem("storred tasks")) {
            alltasks = JSON.parse(localStorage.getItem("storred tasks"))
            showtasks()
        }


        //events
        addbtn.addEventListener("click", triggerAdd)
        alltaskbtn.addEventListener("click", showtasks)
        incomplete.addEventListener("click", showincompletetasks)
        complete.addEventListener("click", showcompletetasks)

        function triggerAdd() {
            console.log(taskinput.value)
            //store the new task
            let dict = {
                name: taskinput.value,
                complete: false
            }



            alltasks.push(dict)
            localStorage.setItem("storred tasks", JSON.stringify(alltasks))
            console.log(alltasks)
            showtasks()

        }

        function showtasks() {
            alltaskbtn.style.backgroundColor = "aquamarine"
            incomplete.style.backgroundColor = "white"
            complete.style.backgroundColor = "white"
            container.innerHTML = ("")
            for (let number = 0; number < alltasks.length; number += 1) {
                if (alltasks[number].complete == false) {
                    let template = `<div id="tasksitem"><input id='${number}' type=checkbox>` + "<p>" + alltasks[number].name + "</p>" + `<button onclick= triggerDelete(${number})>Delete</button></div>`

                    container.insertAdjacentHTML("beforeend", template)
                    //grab a input
                    let input = document.getElementById(`${number}`)
                    input.addEventListener("click", triggerdone.bind(null, number))
                }

                else if (alltasks[number].complete == true) {
                    let template = `<div id="tasksitem"><input id='${number}' type=checkbox checked>` + "<p style='text-decoration:line-through'>" + alltasks[number].name + "</p>" + `<button onclick= triggerDelete(${number})>Delete</button></div>`

                    container.insertAdjacentHTML("beforeend", template)


                    let input = document.getElementById(`${number}`)
                    input.addEventListener("click", triggerundone.bind(null, number))
                }
            }
        }
        function triggerdone(number) {
            alltasks[number].complete = true
            localStorage.setItem("storred tasks", JSON.stringify(alltasks))
            showtasks()
            console.log("done", number)
        }

        function triggerundone(number) {
            alltasks[number].complete = false
            localStorage.setItem("storred tasks", JSON.stringify(alltasks))
            showtasks()
            console.log("Undone", number)
        }

        function showincompletetasks() {
            alltaskbtn.style.backgroundColor = "white"
            incomplete.style.backgroundColor = "aquamarine"
            complete.style.backgroundColor = "white"
            container.innerHTML = ("")
            for (let number = 0; number < alltasks.length; number += 1) {
                if (alltasks[number].complete == false) {
                    let template = `<div id="tasksitem"><input id='${number}' type=checkbox checked>` + "<p style='text-decoration:line-through'>" + alltasks[number].name + "</p>" + `<button onclick= triggerDelete(${number})>Delete</button></div>`

                    container.insertAdjacentHTML("beforeend", template)

                    let input = document.getElementById(`${number}`)
                    input.addEventListener("click", triggerdone.bind(null, number))
                }

            }


        }

        function showcompletetasks() {
            alltaskbtn.style.backgroundColor = "white"
            incomplete.style.backgroundColor = "white"
            complete.style.backgroundColor = "aquamarine"
            container.innerHTML = ("")
            for (let number = 0; number < alltasks.length; number += 1) {
                if (alltasks[number].complete == true) { 
                    let template = `<div id="tasksitem"><input id='${number}' type=checkbox checked>` + "<p style='text-decoration:line-through'>" + alltasks[number].name + "</p>" + `<button onclick= triggerDelete(${number})>Delete</button></div>`

                    container.insertAdjacentHTML("beforeend", template)

                    let input = document.getElementById(`${number}`)
                    input.addEventListener("click", triggerundone.bind(null, number))
                }
            }
        }
        function triggerDelete(number) {
            alltasks.splice(number, 1)
            localStorage.setItem("storred tasks", JSON.stringify(alltasks))
            showtasks()
        }
    </script>
</body>
